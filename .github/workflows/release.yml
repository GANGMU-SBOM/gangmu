name: release

# Publishes to PyPI with Trusted Publishing (no token stored in the repo).
# One-time setup by a maintainer: create the `gangmu-sbom` project on PyPI and
# add this repository + workflow + the `pypi` environment as a trusted publisher.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: the tag matches the version
        run: |
          v=$(python -c "import re;print(re.search(r'^version = \"(.+)\"', open('pyproject.toml').read(), re.M).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # `uses: GANGMU-SBOM/gangmu@v0` reads action.yml at the v0 tag. A git tag never moves on
  # its own, so each release moves its major tag here, once the package it installs is on
  # PyPI.
  major-tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: move the major tag to this release
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
