<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f4e79'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23fff' font-family='serif'%3E纲%3C/text%3E%3C/svg%3E">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/' | relative_url }}">首页</a>
          <a href="{{ '/FAQ.html' | relative_url }}">常见问题</a>
          <a href="{{ '/CRA.html' | relative_url }}">CRA</a>
          <a href="{{ '/CHINA.html' | relative_url }}">国内合规</a>
          <a href="{{ '/BENCHMARK.html' | relative_url }}">评测基准</a>
          <a href="{{ site.github.repository_url }}">GitHub</a>
        </nav>
      </div>
    </header>
    <main class="container content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="container">
        <a href="{{ site.github.repository_url }}">GitHub</a> · 工具 Apache-2.0 · 规则库 CDLA-Permissive-2.0
      </div>
    </footer>
  </body>
</html>
