# Fixture rule for the CI end-to-end job. Generated from
# tests/fixtures/upstream/tinynet exactly as tests/conftest.py does; regenerate
# it the same way if that fixture changes. Not part of the rule base.
id: test/tinynet
component:
  path_globs:
  - '**/tinynet'
  ships_as: tinynet
upstream:
  name: tinynet
  purl: pkg:generic/tinynet
  cpe: cpe:2.3:a:tinynet_project:tinynet:*:*:*:*:*:*:*:*
  license: MIT
  source:
    kind: git
    url: https://example.invalid/tinynet
    ref: v1.4.2
  supplier: tinynet fixture (gangmu test suite)
identity:
  include:
  - src/**/*.c
  - include/**/*.h
  anchors:
  - path: src/core.c
    sha256:
      1.4.2: b8956ea43a9b5d8a0ef75b06b4a8d6656c70f82b3c7c08d8d0dc2d784579e116
  signature:
    algo: winnow-bottomk
    k: 16
    window: 8
    size: 256
    reference_version: 1.4.2
    fileset_sha256: ace673072149c9154dfe99b6074975096409ca4b2c46fca00d3e0155a8e063cd
    values: 
version:
  probes:
  - file: include/tinynet/version.h
    patterns:
      major: TINYNET_VERSION_MAJOR\s+(\d+)
      minor: TINYNET_VERSION_MINOR\s+(\d+)
      revision: TINYNET_VERSION_REVISION\s+(\d+)
    template: '{major}.{minor}.{revision}'
